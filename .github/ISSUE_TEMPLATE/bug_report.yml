name: 🐛 Bug Report
description: File a bug report
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Important:** Please include the provider and model you used. CodeVibe defaults to Codex auth when available, but bugs can vary across model backends.
  - type: dropdown
    id: plugin-type
    attributes:
      label: Plugin Type
      description: Which plugin are you reporting a bug for?
      options:
        - VSCode Extension
        - JetBrains Plugin
        - CLI
      default: 0
    validations:
      required: true
  - type: input
    id: codevibe-version
    attributes:
      label: CodeVibe Version
      description: What version of CodeVibe are you using? (You can find this at the bottom of the Settings view)
      placeholder: 'e.g., 1.2.3'
    validations:
      required: true
  - type: checkboxes
    id: beta
    attributes:
      label: Beta version
      options:
        - label: I am using a beta version of CodeVibe
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do you trigger this bug? Please walk us through it step by step.
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: provider-model
    attributes:
      label: Provider/Model
      description: What provider and model were you using when the issue occurred?
      placeholder: 'e.g., openai-codex:gpt-5.1-codex, CodeVibe:anthropic/claude-sonnet-4.5, gemini:gemini-2.5-pro'
    validations:
      required: false
  - type: textarea
    id: system-info
    attributes:
      label: System Information
      description: What operating system and hardware are you using?
      placeholder: |
        Operating System: Windows 11, macOS Sonoma, Ubuntu 22.04, etc.
        Hardware: CPU, GPU, RAM specifications if relevant
        e.g.,
        OS: Windows 11
        CPU: Intel Core i7-11700K
        GPU: NVIDIA GeForce RTX 3070
        RAM: 32GB DDR4
    validations:
      required: false
