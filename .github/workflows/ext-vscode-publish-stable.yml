name: ext-vscode-publish-stable

on:
    workflow_dispatch:
        inputs:
            release-type:
                description: "Choose release type (release or pre-release)"
                required: true
                default: "release"
                type: choice
                options:
                    - pre-release
                    - release
            auto_create_tag_from_main:
                description: "Auto-create and push the provided tag from the tested main commit (recommended)"
                required: true
                default: true
                type: boolean
            tag:
                description: "Tag to publish (required in both modes, e.g., v3.1.2)"
                required: true
                type: string
            all_parity_validated:
                description: "Confirm local, CI, e2e, VSIX install, and installed-VS-Code parity validation passed"
                required: true
                default: false
                type: boolean
            parity_evidence_url:
                description: "HTTPS URL to the Cursor-parity release checklist or validation log"
                required: true
                type: string

permissions:
    contents: write
    packages: write
    checks: write
    pull-requests: write

env:
    npm_config_cache: ${{ runner.temp }}/npm-cache

jobs:
    test:
        if: github.repository == 'atnumridha/codevibe'
        uses: ./.github/workflows/ext-vscode-test.yml

    e2e:
        if: github.repository == 'atnumridha/codevibe'
        permissions:
            contents: read
            pull-requests: read
            id-token: write
        uses: ./.github/workflows/ext-vscode-test-e2e.yml

    publish:
        needs: [test, e2e]
        name: Publish Extension
        if: github.repository == 'atnumridha/codevibe'
        runs-on: ubuntu-latest
        environment: publish
        defaults:
          run:
            working-directory: apps/vscode

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0
                  fetch-tags: true
                  lfs: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Validate CodeVibe Release Gate
              working-directory: ${{ github.workspace }}
              env:
                  CODEVIBE_ALL_PARITY_VALIDATED: ${{ github.event.inputs.all_parity_validated }}
                  CODEVIBE_PARITY_EVIDENCE_URL: ${{ github.event.inputs.parity_evidence_url }}
              run: |
                  node apps/vscode/scripts/assert-cursor-parity-release-gate.mjs --context "CodeVibe stable publish"

            - name: Validate Marketplace Secrets
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
              run: |
                  missing=()
                  if [[ -z "${VSCE_PAT:-}" ]]; then
                    missing+=("VSCE_PAT")
                  fi
                  if [[ -z "${OVSX_PAT:-}" ]]; then
                    missing+=("OVSX_PAT")
                  fi
                  if (( ${#missing[@]} > 0 )); then
                    echo "Error: missing marketplace secret(s): ${missing[*]}"
                    echo "Use the ext-vscode-github-release workflow for GitHub-only VSIX releases when marketplace secrets are not available."
                    exit 1
                  fi

            - name: Get Version
              id: get_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Resolve Release Tag
              id: resolve_tag
              working-directory: ${{ github.workspace }}
              env:
                  TAG: ${{ github.event.inputs.tag }}
                  AUTO_CREATE: ${{ github.event.inputs.auto_create_tag_from_main }}
                  EXPECTED_TAG: v${{ steps.get_version.outputs.version }}
              run: |
                  TESTED_SHA="${{ github.sha }}"
                  WORKFLOW_REF="${{ github.ref }}"

                  if [[ -z "$TAG" ]]; then
                    echo "Error: tag input is required"
                    exit 1
                  fi

                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
                    echo "Error: tag must match vX.Y.Z (optionally with -suffix or .suffix)"
                    exit 1
                  fi
                  if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
                    echo "Error: tag '$TAG' does not match package version '$EXPECTED_TAG'"
                    exit 1
                  fi
                  TAG_REF="refs/tags/$TAG"

                  git fetch origin main --tags

                  if [[ "$AUTO_CREATE" == "true" ]]; then
                    if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
                      echo "Error: auto-create mode requires dispatching from main (current ref: $WORKFLOW_REF)"
                      exit 1
                    fi
                    echo "Auto-create enabled. Using tested workflow SHA: $TESTED_SHA"

                    if ! git merge-base --is-ancestor "$TESTED_SHA" origin/main; then
                      echo "Error: tested SHA $TESTED_SHA is not on origin/main"
                      exit 1
                    fi

                    if git show-ref --verify --quiet "$TAG_REF"; then
                      TAG_SHA=$(git rev-list -n 1 "$TAG_REF^{commit}")
                      if [[ "$TAG_SHA" != "$TESTED_SHA" ]]; then
                        echo "Error: tag '$TAG' already exists at $TAG_SHA, not at tested SHA ($TESTED_SHA)"
                        exit 1
                      fi
                      echo "Tag '$TAG' already exists at tested SHA. Continuing."
                    else
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git tag "$TAG" "$TESTED_SHA"
                      git push origin "$TAG_REF"
                      echo "Created and pushed tag '$TAG' from tested SHA $TESTED_SHA."
                    fi
                  else
                    if ! git show-ref --verify --quiet "$TAG_REF"; then
                      echo "Error: tag '$TAG' does not exist in the repository"
                      exit 1
                    fi
                    TAG_SHA=$(git rev-list -n 1 "$TAG_REF^{commit}")
                    if [[ "$TAG_SHA" != "$TESTED_SHA" ]]; then
                      echo "Error: tag '$TAG' exists at $TAG_SHA, but tests ran against $TESTED_SHA"
                      exit 1
                    fi
                    echo "Using existing tag '$TAG' at tested SHA."
                  fi

                  git checkout --detach "$TAG_REF^{commit}"
                  CHECKED_OUT_TAG="v$(node -p "require('./apps/vscode/package.json').version")"
                  if [[ "$TAG" != "$CHECKED_OUT_TAG" ]]; then
                    echo "Error: tag '$TAG' points at a package version '$CHECKED_OUT_TAG'"
                    exit 1
                  fi
                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "resolved_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

            - name: Install extension dependencies
              working-directory: ${{ github.workspace }}
              run: npm --prefix apps/vscode ci --include=optional

            - name: Install webview-ui dependencies
              working-directory: ${{ github.workspace }}
              run: npm --prefix apps/vscode/webview-ui ci --include=optional

            - name: Install Publishing Tools
              run: npm install -g @vscode/vsce ovsx

            - name: Package and Publish Extension
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
                  CODEVIBE_ENVIRONMENT: production
                  TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
                  ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
                  # OpenTelemetry production defaults (can be overridden at runtime)
                  OTEL_TELEMETRY_ENABLED: ${{ secrets.OTEL_TELEMETRY_ENABLED }}
                  OTEL_LOGS_EXPORTER: otlp
                  OTEL_METRICS_EXPORTER: otlp
                  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
                  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
                  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
                  RELEASE_TYPE: ${{ github.event.inputs.release-type }}
                  CODEVIBE_ALL_PARITY_VALIDATED: ${{ github.event.inputs.all_parity_validated }}
                  CODEVIBE_PARITY_EVIDENCE_URL: ${{ github.event.inputs.parity_evidence_url }}
              run: |
                  # Swap README.marketplace.md into README.md so both the GitHub
                  # release artifact (vsce package below) and the marketplace
                  # publish (npm run publish:marketplace below, which swaps
                  # internally as an idempotent no-op) ship the same README.
                  # Required to generate the GitHub Release .vsix
                  # Installed-extension validation is covered by the required
                  # cross-platform e2e workflow. Avoid running the GUI-backed
                  # VS Code CLI smoke install in the release packager, where it
                  # can hang on GitHub-hosted Linux.
                  package_args=(--out-dir . --require-release-gate)
                  if [ "$RELEASE_TYPE" = "pre-release" ]; then
                    package_args+=(--pre-release)
                  fi
                  node scripts/package-github-vsix.mjs "${package_args[@]}"

                  if [ "$RELEASE_TYPE" = "pre-release" ]; then
                    npm run publish:marketplace:prerelease
                    echo "Successfully published pre-release version ${{ steps.get_version.outputs.version }} to VS Code Marketplace and Open VSX Registry"
                  else
                    npm run publish:marketplace
                    echo "Successfully published release version ${{ steps.get_version.outputs.version }} to VS Code Marketplace and Open VSX Registry"
                  fi

            - name: Setup Bun for standalone evidence
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install standalone workspace dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile

            - name: Collect Cursor-Parity Evidence
              if: ${{ always() }}
              working-directory: ${{ github.workspace }}
              run: |
                  node apps/vscode/scripts/collect-cursor-parity-evidence.mjs --run-retrieval-indexing --run-mcp-oauth --run-standalone-ui --run-sandbox-policy --run-deeplinks --run-ndjson --run-background-agents --run-browser-tools --run-mermaid-planning --out-file apps/vscode/cursor-parity-evidence.md

            - name: Prepare standalone release assets
              working-directory: ${{ github.workspace }}
              run: |
                  node apps/vscode/scripts/prepare-standalone-release-assets.mjs

            - name: Get Previous Tag
              id: prev_tag
              working-directory: ${{ github.workspace }}
              run: |
                  CURRENT_TAG="${{ steps.resolve_tag.outputs.tag }}"
                  PREV_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || echo "")
                  echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

            - name: Get Changelog Entry
              id: changelog
              working-directory: ${{ github.workspace }}
              run: |
                  # Get content between first ## [ and second ## [
                  CONTENT=$(awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md)
                  echo "content<<EOF" >> $GITHUB_OUTPUT
                  echo "$CONTENT" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.resolve_tag.outputs.tag }}
                  files: |
                      apps/vscode/*.vsix
                      apps/vscode/dist-standalone/standalone.zip
                      apps/vscode/dist-standalone/standalone.zip.sha256
                      apps/vscode/dist-standalone/standalone-manifest.json
                      apps/vscode/cursor-parity-evidence.md
                  body: |
                      ${{ steps.changelog.outputs.content }}

                      **Cursor-Parity Evidence**: ${{ github.event.inputs.parity_evidence_url }}

                      **Attached Evidence Log**: `cursor-parity-evidence.md`

                      **Attached Standalone Runtime**: `standalone.zip`, `standalone.zip.sha256`, `standalone-manifest.json`

                      **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ steps.resolve_tag.outputs.tag }}
                  prerelease: ${{ github.event.inputs.release-type == 'pre-release' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Post release to Slack
              uses: slackapi/slack-github-action@v3.0.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
                  payload: |
                    channel: "C0APVKGGZFC"
                    text: "CodeVibe ${{ steps.resolve_tag.outputs.tag }}"
                    blocks:
                      - type: "section"
                        text:
                          type: "mrkdwn"
                          text: "*CodeVibe ${{ steps.resolve_tag.outputs.tag }}*"
                      - type: "section"
                        text:
                          type: "mrkdwn"
                          text: ${{ toJSON(steps.changelog.outputs.content) }}
                      - type: "context"
                        elements:
                          - type: "mrkdwn"
                            text: "Full Changelog: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ steps.resolve_tag.outputs.tag }}"
