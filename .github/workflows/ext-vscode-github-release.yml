name: ext-vscode-github-release

on:
    push:
        tags:
            - "v*-rc.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to create or reuse. Candidate: v3.1.2-rc.1; final: v3.1.2"
                required: true
                type: string
            create_tag_from_ref:
                description: "Create the tag from the dispatched ref if it does not exist"
                required: true
                default: true
                type: boolean
            release_stage:
                description: "candidate publishes a draft/prerelease VSIX for validation; final requires parity evidence"
                required: true
                default: "candidate"
                type: choice
                options:
                    - candidate
                    - final
            prerelease:
                description: "Mark the GitHub Release as a prerelease"
                required: true
                default: true
                type: boolean
            draft:
                description: "Create the GitHub Release as a draft"
                required: true
                default: true
                type: boolean
            run_tests:
                description: "Run the VS Code extension test workflow before packaging"
                required: true
                default: true
                type: boolean
            run_e2e:
                description: "Run the VS Code extension e2e workflow before packaging"
                required: true
                default: true
                type: boolean
            all_parity_validated:
                description: "Confirm local, CI, e2e, VSIX install, and installed-VS-Code parity validation passed"
                required: false
                default: false
                type: boolean
            parity_evidence_url:
                description: "HTTPS URL to the Cursor-parity release checklist or validation log"
                required: false
                default: ""
                type: string

permissions:
    contents: write
    checks: write
    pull-requests: write

jobs:
    test:
        if: ${{ github.repository == 'atnumridha/codevibe' && (github.event.inputs.run_tests || 'true') == 'true' }}
        uses: ./.github/workflows/ext-vscode-test.yml

    e2e:
        if: ${{ github.repository == 'atnumridha/codevibe' && (github.event.inputs.run_e2e || 'true') == 'true' }}
        permissions:
            contents: read
            pull-requests: read
            id-token: write
        uses: ./.github/workflows/ext-vscode-test-e2e.yml

    package-release:
        name: Package VSIX and Publish GitHub Release
        runs-on: ubuntu-latest
        needs: [test, e2e]
        if: ${{ github.repository == 'atnumridha/codevibe' && always() && ((github.event.inputs.run_tests || 'true') != 'true' || needs.test.result == 'success') && ((github.event.inputs.run_e2e || 'true') != 'true' || needs.e2e.result == 'success') }}
        defaults:
            run:
                working-directory: apps/vscode

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  lfs: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Validate Release Inputs
              working-directory: ${{ github.workspace }}
              env:
                  RELEASE_STAGE: ${{ github.event.inputs.release_stage || 'candidate' }}
                  PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
                  DRAFT: ${{ github.event.inputs.draft || 'true' }}
                  RUN_TESTS: ${{ github.event.inputs.run_tests || 'true' }}
                  RUN_E2E: ${{ github.event.inputs.run_e2e || 'true' }}
                  CODEVIBE_ALL_PARITY_VALIDATED: ${{ github.event.inputs.all_parity_validated || 'false' }}
                  CODEVIBE_PARITY_EVIDENCE_URL: ${{ github.event.inputs.parity_evidence_url || '' }}
              run: |
                  if [[ "$RUN_TESTS" != "true" || "$RUN_E2E" != "true" ]]; then
                    echo "Error: CodeVibe VSIX releases must run both test and e2e workflows."
                    exit 1
                  fi
                  if [[ "$RELEASE_STAGE" == "candidate" ]]; then
                    if [[ "$PRERELEASE" != "true" || "$DRAFT" != "true" ]]; then
                      echo "Error: candidate VSIX releases must be both prerelease and draft."
                      exit 1
                    fi
                    echo "Candidate VSIX release selected; final Cursor-parity evidence gate is intentionally skipped."
                  else
                    node apps/vscode/scripts/assert-cursor-parity-release-gate.mjs --context "CodeVibe final GitHub VSIX release"
                  fi

            - name: Get Version
              id: get_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Resolve Release Tag
              id: resolve_tag
              working-directory: ${{ github.workspace }}
              env:
                  TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
                  CREATE_TAG: ${{ github.event.inputs.create_tag_from_ref || 'false' }}
                  PACKAGE_VERSION: ${{ steps.get_version.outputs.version }}
                  RELEASE_STAGE: ${{ github.event.inputs.release_stage || 'candidate' }}
              run: |
                  if [[ -z "$TAG" ]]; then
                    echo "Error: tag input is required"
                    exit 1
                  fi

                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
                    echo "Error: tag must match vX.Y.Z, optionally with a suffix"
                    exit 1
                  fi

                  EXPECTED_TAG="v$PACKAGE_VERSION"
                  if [[ "$RELEASE_STAGE" == "final" ]]; then
                    if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
                      echo "Error: final tag '$TAG' does not match package version '$EXPECTED_TAG'"
                      exit 1
                    fi
                  else
                    if [[ "$PACKAGE_VERSION" == *-* ]]; then
                      if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
                        echo "Error: candidate tag '$TAG' must match prerelease package version '$EXPECTED_TAG'"
                        exit 1
                      fi
                    else
                      case "$TAG" in
                        ${EXPECTED_TAG}-rc.*) ;;
                        *)
                          echo "Error: candidate tag '$TAG' must use an rc suffix like '$EXPECTED_TAG-rc.1'"
                          exit 1
                          ;;
                      esac
                    fi
                  fi

                  git fetch origin --tags
                  TAG_REF="refs/tags/$TAG"

                  if git show-ref --verify --quiet "$TAG_REF"; then
                    git checkout --detach "$TAG_REF^{commit}"
                  elif [[ "$CREATE_TAG" == "true" ]]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git tag "$TAG" "$GITHUB_SHA"
                    git push origin "$TAG_REF"
                    git checkout --detach "$TAG_REF^{commit}"
                  else
                    echo "Error: tag '$TAG' does not exist and create_tag_from_ref is false"
                    exit 1
                  fi

                  CHECKED_OUT_TAG="v$(node -p "require('./apps/vscode/package.json').version")"
                  if [[ "$TAG" != "$CHECKED_OUT_TAG" ]]; then
                    if [[ "$RELEASE_STAGE" != "candidate" || "$TAG" != "$CHECKED_OUT_TAG"-rc.* ]]; then
                      echo "Error: tag '$TAG' points at a package version '$CHECKED_OUT_TAG'"
                      exit 1
                    fi
                  fi

                  RESOLVED_SHA=$(git rev-parse HEAD)
                  if [[ "$RESOLVED_SHA" != "$GITHUB_SHA" ]]; then
                    echo "Error: tag '$TAG' resolves to $RESOLVED_SHA, but tests ran against $GITHUB_SHA"
                    exit 1
                  fi

                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

            - name: Install extension dependencies
              working-directory: ${{ github.workspace }}
              run: npm --prefix apps/vscode ci --include=optional

            - name: Install webview-ui dependencies
              working-directory: ${{ github.workspace }}
              run: npm --prefix apps/vscode/webview-ui ci --include=optional

            - name: Install VSIX packaging tool
              run: npm install -g @vscode/vsce

            - name: Package VSIX
              env:
                  CODEVIBE_ENVIRONMENT: production
                  TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
                  ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
                  CODEVIBE_ALL_PARITY_VALIDATED: ${{ github.event.inputs.all_parity_validated || 'false' }}
                  CODEVIBE_PARITY_EVIDENCE_URL: ${{ github.event.inputs.parity_evidence_url || '' }}
                  RELEASE_STAGE: ${{ github.event.inputs.release_stage || 'candidate' }}
                  PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
              run: |
                  npm run ci:build
                  # Installed-extension validation is covered by the required
                  # cross-platform e2e workflow. Avoid running the GUI-backed
                  # VS Code CLI smoke install in the release packager, where it
                  # can hang on GitHub-hosted Linux.
                  package_args=(--out-dir .)
                  if [[ "$RELEASE_STAGE" == "final" ]]; then
                    package_args+=(--require-release-gate)
                  fi
                  if [[ "$PRERELEASE" == "true" ]]; then
                    package_args+=(--pre-release)
                  fi
                  node scripts/package-github-vsix.mjs "${package_args[@]}"

            - name: Setup Bun for standalone evidence
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install standalone workspace dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile

            - name: Collect Cursor-Parity Evidence
              if: ${{ always() }}
              continue-on-error: ${{ (github.event.inputs.release_stage || 'candidate') == 'candidate' }}
              working-directory: ${{ github.workspace }}
              run: |
                  node apps/vscode/scripts/collect-cursor-parity-evidence.mjs --run-retrieval-indexing --run-mcp-oauth --run-standalone-ui --run-sandbox-policy --run-deeplinks --run-ndjson --run-background-agents --run-browser-tools --run-mermaid-planning --out-file apps/vscode/cursor-parity-evidence.md

            - name: Prepare standalone release assets
              working-directory: ${{ github.workspace }}
              run: |
                  node apps/vscode/scripts/prepare-standalone-release-assets.mjs

            - name: Get Previous Tag
              id: prev_tag
              working-directory: ${{ github.workspace }}
              run: |
                  CURRENT_TAG="${{ steps.resolve_tag.outputs.tag }}"
                  PREV_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || echo "")
                  echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

            - name: Get Changelog Entry
              id: changelog
              working-directory: ${{ github.workspace }}
              run: |
                  CONTENT=$(awk '/^## \[/{if(found) exit; found=1; next} found{print}' CHANGELOG.md)
                  echo "content<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$CONTENT" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.resolve_tag.outputs.tag }}
                  files: |
                      apps/vscode/*.vsix
                      apps/vscode/dist-standalone/standalone.zip
                      apps/vscode/dist-standalone/standalone.zip.sha256
                      apps/vscode/dist-standalone/standalone-manifest.json
                      apps/vscode/cursor-parity-evidence.md
                  body: |
                      ${{ steps.changelog.outputs.content }}

                      **Release Stage**: ${{ github.event.inputs.release_stage || 'candidate' }}

                      **Cursor-Parity Evidence**: ${{ (github.event.inputs.release_stage || 'candidate') == 'final' && github.event.inputs.parity_evidence_url || 'pending final validation' }}

                      **Attached Evidence Log**: `cursor-parity-evidence.md`

                      **Attached Standalone Runtime**: `standalone.zip`, `standalone.zip.sha256`, `standalone-manifest.json`

                      **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ steps.resolve_tag.outputs.tag }}
                  prerelease: ${{ (github.event.inputs.release_stage || 'candidate') == 'candidate' || (github.event.inputs.prerelease || 'true') == 'true' }}
                  draft: ${{ (github.event.inputs.release_stage || 'candidate') == 'candidate' || (github.event.inputs.draft || 'true') == 'true' }}
                  make_latest: ${{ (github.event.inputs.release_stage || 'candidate') == 'final' && (github.event.inputs.prerelease || 'false') != 'true' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
