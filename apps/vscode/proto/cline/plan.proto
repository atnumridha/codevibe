syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service PlanService {
  rpc listPlans(EmptyRequest) returns (PlanRegistry);
  rpc getPlan(PlanRequest) returns (PlanFile);
  rpc updatePlan(PlanUpdateRequest) returns (PlanFile);
  rpc updatePlanTodoStatus(PlanTodoStatusRequest) returns (PlanFile);
  rpc buildPlan(BuildPlanRequest) returns (BuildPlanResponse);
  rpc openPlan(PlanRequest) returns (Empty);
}

message PlanTodo {
  string id = 1;
  string content = 2;
  string status = 3;
  repeated string dependencies = 4;
}

message PlanPhase {
  string name = 1;
  repeated PlanTodo todos = 2;
}

message PlanMetadata {
  string name = 1;
  string overview = 2;
  repeated PlanTodo todos = 3;
  bool is_project = 4;
  repeated PlanPhase phases = 5;
}

message PlanRegistryEntry {
  string id = 1;
  string name = 2;
  string uri = 3;
  string created_by = 4;
  repeated string edited_by = 5;
  repeated string referenced_by = 6;
  repeated string built_by = 7;
  int64 created_at = 8;
  int64 last_updated_at = 9;
  string status = 10;
  repeated string redirects = 11;
}

message PlanRegistry {
  repeated PlanRegistryEntry plans = 1;
}

message PlanFile {
  string plan_id = 1;
  string plan_path = 2;
  PlanMetadata metadata = 3;
  string body = 4;
  string serialized = 5;
  string status = 6;
  int32 todo_count = 7;
  int32 completed_todo_count = 8;
  string build_status = 9;
}

message PlanRequest {
  Metadata metadata = 1;
  string plan_id = 2;
  string plan_path = 3;
}

message PlanUpdateRequest {
  Metadata metadata = 1;
  string plan_id = 2;
  string plan_path = 3;
  PlanMetadata plan_metadata = 4;
  string body = 5;
}

message PlanTodoStatusRequest {
  Metadata metadata = 1;
  string plan_id = 2;
  string plan_path = 3;
  repeated string todo_ids = 4;
  string status = 5;
}

message BuildPlanRequest {
  Metadata metadata = 1;
  string plan_id = 2;
  string plan_path = 3;
  string mode = 4;
  repeated string todo_ids = 5;
}

message BuildPlanResponse {
  bool started = 1;
  string mode = 2;
  string message = 3;
  PlanFile plan = 4;
}
